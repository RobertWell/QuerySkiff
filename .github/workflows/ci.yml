# HEL-95: QuerySkiff CI — the Kotlin/Quarkus backend, the frontend build, and
# the Playwright browser e2e suite run on every push/PR, so the migration's
# "suites pass in CI" criterion is met by an automated gate rather than a
# manual local build. The JVM suite is hermetic (generated parquet fixtures +
# in-process Quarkus; no live MinIO); the e2e suite drives the REAL production
# bundle via vite preview with the API mocked at the network layer.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build + test (Kotlin/Quarkus backend)
        working-directory: backend-jvm
        run: mvn -B -ntp package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-surefire-reports
          path: backend-jvm/target/surefire-reports/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install + typecheck + build (Vite/TS SPA)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      # HEL-181: vitest line-coverage gate — a measurable number the Playwright
      # e2e suite (black-box, no instrumentation) can't provide.
      - name: Unit tests + coverage (vitest)
        working-directory: frontend
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the production bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser e2e (real bundle, mocked API)
        working-directory: frontend
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            frontend/e2e-results.xml
            frontend/test-results/
          retention-days: 7
