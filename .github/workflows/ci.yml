# HEL-95: QuerySkiff CI — the Kotlin/Quarkus backend + the frontend build run on
# every push/PR, so the migration's "suites pass in CI" criterion is met by an
# automated gate rather than a manual local build. The JVM test suite is
# hermetic (generated parquet fixtures + in-process Quarkus; no live MinIO), so
# it runs on a bare runner. Playwright/e2e is not yet present in the repo; add it
# here when those suites exist.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build + test (Kotlin/Quarkus backend)
        working-directory: backend-jvm
        run: mvn -B -ntp package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-surefire-reports
          path: backend-jvm/target/surefire-reports/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install + typecheck + build (Vite/TS SPA)
        working-directory: frontend
        run: |
          npm ci
          npm run build
