# QuerySkiff (HEL-90): one Deployment + one ClusterIP Service. External access is
# ONLY through the existing gateway's /queryskiff route (spec requirement) — no
# NodePort, no ingress of its own. MinIO credentials come from the on-node
# Secret queryskiff-minio (read-only credential), never in git.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queryskiff
  namespace: queryskiff
  labels:
    app: queryskiff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: queryskiff
  template:
    metadata:
      labels:
        app: queryskiff
    spec:
      containers:
        - name: queryskiff
          image: docker.io/roguerzzz123/queryskiff:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5400
          env:
            - name: QUERYSKIFF_BASE_PATH
              value: /queryskiff
            - name: MINIO_ENDPOINT
              value: minio.minio.svc.cluster.local:9000
            - name: MINIO_SECURE
              value: "false"
            - name: QUERYSKIFF_ALLOWED_BUCKETS
              value: "model-results"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: queryskiff-minio
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: queryskiff-minio
                  key: secret-key
          readinessProbe:
            httpGet:
              path: /queryskiff/health
              port: 5400
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /queryskiff/health
              port: 5400
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 5Gi        # DuckDB memory_limit 4GB + headroom
---
apiVersion: v1
kind: Service
metadata:
  name: queryskiff
  namespace: queryskiff
spec:
  type: ClusterIP
  selector:
    app: queryskiff
  ports:
    - port: 5400
      targetPort: 5400
