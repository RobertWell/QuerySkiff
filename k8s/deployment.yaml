# QuerySkiff (HEL-90): one Deployment + one ClusterIP Service. External access is
# ONLY through the existing gateway's /queryskiff route (spec requirement) — no
# NodePort, no ingress of its own. MinIO credentials come from the on-node
# Secret queryskiff-minio (read-only credential), never in git.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queryskiff
  namespace: queryskiff
  labels:
    app: queryskiff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: queryskiff
  template:
    metadata:
      labels:
        app: queryskiff
    spec:
      containers:
        - name: queryskiff
          # HEL-95 cutover 2026-07-31: Kotlin/Quarkus backend (was the Python
          # image roguerzzz123/queryskiff:latest — still published; rollback =
          # revert this line). Same env/port/probe contract; contract suite
          # 35/0 against this exact image, canary-proven in-cluster pre-flip.
          #
          # HEL-131, 2026-08-08: PINNED BY DIGEST. This was `:latest` with
          # pullPolicy: Always, which meant nothing recorded which build was
          # running and any restart could silently pull different bytes. That is
          # not hypothetical here — it is exactly why the Cycle-3 soak could not
          # initially tell whether prod matched `main`, and it cost a day
          # establishing that the soaked artifact was a Java 17 build while main
          # had moved to 21. A soak is meaningless if the artifact can change
          # underneath it.
          #
          # This digest is the 2026-08-06 rebuild from main, read back from the
          # RUNNING pod's imageID (not from `:latest`, which is a moving target
          # and would defeat the point): Java 21.0.11 LTS, Quarkus 3.6.4 with
          # kotlin + micrometer, /q/metrics serving real Prometheus exposition.
          #
          # To ship a new build: push it, read the digest back from the registry,
          # and update this line. `:latest` still moves for convenience, but prod
          # no longer follows it.
          image: docker.io/roguerzzz123/queryskiff-jvm@sha256:a89f2d657072dfa14dc0b3fd3ef0de4558477bc4e9380b3a85c447b7550cb535
          # IfNotPresent is correct with a digest: the digest IS the identity, so
          # a re-pull can only ever fetch the same bytes. Always would just add a
          # registry round-trip per restart.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5400
          env:
            - name: QUERYSKIFF_BASE_PATH
              value: /queryskiff
            - name: MINIO_ENDPOINT
              value: minio.minio.svc.cluster.local:9000
            - name: MINIO_SECURE
              value: "false"
            - name: QUERYSKIFF_ALLOWED_BUCKETS
              value: "model-results"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: queryskiff-minio
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: queryskiff-minio
                  key: secret-key
          readinessProbe:
            httpGet:
              path: /queryskiff/health
              port: 5400
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /queryskiff/health
              port: 5400
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 5Gi        # DuckDB memory_limit 4GB + headroom
---
apiVersion: v1
kind: Service
metadata:
  name: queryskiff
  namespace: queryskiff
spec:
  type: ClusterIP
  selector:
    app: queryskiff
  ports:
    - port: 5400
      targetPort: 5400
