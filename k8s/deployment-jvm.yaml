# HEL-95 cutover canary: the Kotlin/Quarkus backend running BESIDE the Python
# deployment with the identical env contract (same secret, same port, same
# probes). Not routed by the gateway — reachable only in-cluster via the
# queryskiff-jvm Service, so it can soak and be verified without touching the
# live path. Cutover = point the main deployment's image at queryskiff-jvm;
# rollback = revert that commit (the Python image stays published).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queryskiff-jvm
  namespace: queryskiff
  labels:
    app: queryskiff-jvm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: queryskiff-jvm
  template:
    metadata:
      labels:
        app: queryskiff-jvm
    spec:
      containers:
        - name: queryskiff-jvm
          image: docker.io/roguerzzz123/queryskiff-jvm:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5400
          env:
            - name: QUERYSKIFF_BASE_PATH
              value: /queryskiff
            - name: MINIO_ENDPOINT
              value: minio.minio.svc.cluster.local:9000
            - name: MINIO_SECURE
              value: "false"
            - name: QUERYSKIFF_ALLOWED_BUCKETS
              value: "model-results"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: queryskiff-minio
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: queryskiff-minio
                  key: secret-key
          readinessProbe:
            httpGet:
              path: /queryskiff/health
              port: 5400
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /queryskiff/health
              port: 5400
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 5Gi        # DuckDB memory_limit 4GB + JVM headroom
---
apiVersion: v1
kind: Service
metadata:
  name: queryskiff-jvm
  namespace: queryskiff
spec:
  type: ClusterIP
  selector:
    app: queryskiff-jvm
  ports:
    - port: 5400
      targetPort: 5400
