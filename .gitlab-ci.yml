# QuerySkiff CI — build, prove, and publish the JVM image.
#
# WHY THIS EXISTS: QuerySkiff had GitHub Actions that only *tested*; nothing
# published an image, so every prod image was hand-built. That is how the prod
# deployment ended up on Quarkus 3.6.4 (Dec 2023) carrying a CRITICAL and 30
# HIGH CVEs while main had moved on — HEL-138 finding F1. An unpublished
# artifact path means "fixed in git" and "fixed in prod" can drift for years.
#
# Three lessons from the hello-sre/hello-stock images are deliberately encoded:
#  1. SMOKE THE IMAGE BEFORE PUSHING. A green test suite proves the SOURCE
#     works; it does not prove the built container starts. hello-sre shipped an
#     exporter whose Dockerfile COPY list missed a module — build green, tests
#     green, prod crash-looped and lost its only Mimir source for ~5 minutes.
#     So the entrypoint is exercised INSIDE the image before it is pushed.
#  2. :SHA ONLY, never :latest. A `:latest` push silently auto-promotes every
#     build to any deployment tracking it (HEL-277). Promotion must stay a
#     reviewed digest pin.
#  3. PRINT THE DIGEST. Promotion pins by digest, and a re-tag mints a NEW one,
#     so the pushed digest is emitted as `pin=` rather than being re-derived.
# 2026-09-27: GitHub Actions retired (owner: "remove all GitHub CI behaviour").
# The three gates that only existed there — frontend vitest coverage, the
# Playwright e2e against the real bundle, and the trivy CVE scan with its weekly
# schedule — live here now, so one CI is the truth. The weekly scan is a GitLab
# pipeline schedule on main (Mon 03:23 UTC) that sets SCHEDULED_SCAN=1; the
# other jobs skip scheduled pipelines.
stages: [test, build]

variables:
  REGISTRY_NAMESPACE: roguerzzz123
  IMAGE_NAME: queryskiff-jvm

backend-tests:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  timeout: 40 minutes
  cache:
    key: queryskiff-m2
    paths: [.m2/repository]
  script:
    - mvn -f backend-jvm/pom.xml -B -Dmaven.repo.local=.m2/repository test
  artifacts:
    when: always
    reports:
      junit: backend-jvm/target/surefire-reports/TEST-*.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# HEL-181 (ported from .github/workflows/ci.yml): typecheck + production build,
# then the vitest line-coverage gate — a measurable number the black-box
# Playwright suite cannot provide.
frontend-tests:
  stage: test
  image: node:20-bookworm-slim
  timeout: 30 minutes
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [frontend/.npm]
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - npm run test:coverage
  artifacts:
    when: always
    paths: [frontend/coverage/]
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# HEL-95 (ported): the browser e2e suite drives the REAL production bundle via
# `vite preview` with the API mocked at the network layer (playwright.config.ts
# webServer). The official Playwright image carries chromium + its OS deps and
# is pulled ONCE per runner node (IfNotPresent); the first attempt installed
# them with apt on every run and spent 40+ minutes on the LAN link (job 14980).
# The tag MUST match @playwright/test in frontend/package-lock.json (1.62.1).
frontend-e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  timeout: 60 minutes
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [frontend/.npm]
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - CI=1 npx playwright test
  artifacts:
    when: always
    paths: [frontend/e2e-results.xml, frontend/test-results/]
    reports:
      junit: frontend/e2e-results.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# HEL-147 (ported from .github/workflows/security.yml): the final image's
# exposure without building it — `fs` scans the shipped Maven/npm dependency
# set, `image` scans the Dockerfile base images. HIGH/CRITICAL block; a scanner
# or DB failure fails the job, never a silent pass. Runs on every push/MR AND on
# the weekly schedule (new CVEs arrive without commits). Uses the trivy image
# from Docker Hub (LAN mirror) instead of downloading the binary from GitHub —
# that download reset on three repos' jobs on 2026-09-27 (HEL-529).
# HEL-529: trivy's vulnerability DB (~60 MiB) and Java index (~930 MiB) come from hello-sre's daily
# package-registry mirror (scripts/ci/trivy-db-mirror.sh → generic package trivy-db/latest), fetched
# in-cluster with the job token — this project is on hello-sre's job-token allowlist. Without it the
# base-image scan downloaded the Java index from mirror.gcr.io over the uplink and died on a
# connection reset (job 15122) or its 40-minute timeout (job 15076). fetch_trivy_dbs falls back to
# the live download when the mirror is absent, stale (>3 days) or corrupt, so a broken mirror is
# slow, never wrong or silently green. The scans then run with --skip-db-update
# --skip-java-db-update when the mirror answered (TRIVY_DB_SOURCE=mirror), live otherwise.
.trivy_dbs_from_mirror: &trivy_dbs_from_mirror
  - |
    set -e
    apk add --no-cache -q curl python3 git >/dev/null
    rm -rf hello-sre && git init -q hello-sre && cd hello-sre
    git -c credential.helper='!f() { echo username=gitlab-ci-token; echo "password=$CI_JOB_TOKEN"; }; f' fetch -q --depth 1 "http://gitlab.gitlab.svc.cluster.local/root/hello-sre.git" "$HELLO_SRE_REF"
    git checkout -q FETCH_HEAD; [ "$(git rev-parse HEAD)" = "$HELLO_SRE_REF" ] || { echo "ERROR: hello-sre did not resolve to the pinned $HELLO_SRE_REF"; exit 2; }
    cd "$CI_PROJECT_DIR"
    . hello-sre/scripts/ci/trivy-db-fetch.sh
    if fetch_trivy_dbs 1; then echo "--- trivy DBs from the hello-sre mirror"; echo "TRIVY_SKIP_DB_UPDATE=true" >> trivy-db.env; echo "TRIVY_SKIP_JAVA_DB_UPDATE=true" >> trivy-db.env
    else echo "--- mirror unavailable: trivy downloads its DBs live"; : > trivy-db.env; fi

cve-scan:
  stage: test
  image:
    name: aquasec/trivy:0.71.2
    entrypoint: [""]
  timeout: 60 minutes
  variables:
    TRIVY_DB_REPOSITORY: "public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2"
    # The vuln DB (~60 MiB) and the Java DB (~930 MiB, needed to read jars inside
    # the runtime image) are cached between pipelines; job 14975 spent its whole
    # default 5-minute trivy timeout downloading the Java DB over the LAN link.
    TRIVY_CACHE_DIR: $CI_PROJECT_DIR/.trivycache
    TRIVY_TIMEOUT: 40m
    TRIVY_SKIP_VERSION_CHECK: "true"
    TRIVY_VERSION: "0.71.2"
    HELLO_SRE_REF: "4933c7f46d04563d4521bb69725b53fb8ab49b20"
    MIRROR: "10.152.183.230:5000"
  cache:
    key: trivy-dbs
    paths: [.trivycache]
  script:
    - trivy --version
    - *trivy_dbs_from_mirror
    - set -a; . ./trivy-db.env; set +a
    - |
      # --offline-scan: trivy otherwise resolves every Maven POM from Central to build
      # the dependency tree and Central answered 429 Too Many Requests on the first run
      # (job 14970). Offline covers the npm lockfile fully and the DECLARED Maven deps;
      # the transitive truth comes from cve-scan-artifact on the built image below.
      echo "=== blocking dependency scan (HIGH/CRITICAL fail the gate; offline)"
      trivy fs --offline-scan --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
        --ignorefile .trivyignore.yaml --format table .
    - |
      # Only the RUNTIME base (the last FROM) ships; node/maven are build stages that
      # never reach the registry, and each is a ~1 GiB pull on this link.
      img=$(grep -E '^FROM ' backend-jvm/Dockerfile | tail -1 | awk '{print $2}')
      # Pull the layers through the LAN pull-through cache (hello-sre registry-mirror, plain HTTP,
      # fixed ClusterIP), not straight from Docker Hub: job 15076 (2026-09-30) spent its whole 40-minute
      # trivy timeout fetching eclipse-temurin:21-jre over the uplink. build-image pulls the same base
      # through the mirror, so it is warm. Official images live under library/ on a mirror.
      case "$img" in */*) mimg="$MIRROR/$img" ;; *) mimg="$MIRROR/library/$img" ;; esac
      # Report-only since 2026-09-30: the Dockerfile's runtime stage now applies the base's security
      # updates (apt upgrade), so a finding on the RAW base tag is not a finding on what ships — job
      # 15154 blocked on openssl CVE-2026-84782 that the upgrade step fixes. The blocking gate for the
      # shipped image is cve-scan-artifact below (the pushed :SHA, --ignore-unfixed, exit 1).
      echo "=== base-image scan of the runtime stage (report-only; the built artifact is gated): $img (via $mimg)"
      trivy image --insecure --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --format table "$mimg"
  after_script:
    - trivy fs --offline-scan --scanners vuln --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --exit-code 0 --format json --output trivy-full.json . || true
  artifacts:
    when: always
    paths: [trivy-full.json]
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_SCAN == "1"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

build-image:
  stage: build
  image: docker:27
  timeout: 40 minutes
  tags: [privileged]
  services:
    - name: docker:27-dind
      alias: docker
      # HEL-388: pull base images through the LAN pull-through cache (hello-sre
      # hello-gitlab/apps/registry-mirror, fixed ClusterIP — dind has no cluster DNS).
      # Cached layers keep serving while registry-1.docker.io is down; pushes still
      # go straight to Docker Hub. Plain HTTP in-cluster, hence insecure-registry.
      command: ["--tls=false", "--registry-mirror", "http://10.152.183.230:5000", "--insecure-registry", "10.152.183.230:5000"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - |
      set -e
      for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
      IMAGE="$REGISTRY_NAMESPACE/$IMAGE_NAME"; TAG="$CI_COMMIT_SHORT_SHA"
      echo "=== build $IMAGE:$TAG"
      docker build --pull -t "$IMAGE:$TAG" -f backend-jvm/Dockerfile .
      # (1) prove the built image actually starts before it can be promoted
      echo "=== smoke: run the entrypoint inside the image"
      docker run --rm --entrypoint sh "$IMAGE:$TAG" -c \
        'test -f /app/quarkus-run.jar || test -d /app/lib' \
        && echo "    image layout ok"
      docker run -d --name qs-smoke -p 5400:5400 "$IMAGE:$TAG" >/dev/null
      ok=0; for i in $(seq 1 30); do
        docker logs qs-smoke 2>&1 | grep -q "started in" && { ok=1; break; }
        docker logs qs-smoke 2>&1 | grep -qiE "exception in thread|failed to start" && break
        sleep 2
      done
      docker logs qs-smoke 2>&1 | tail -5; docker rm -f qs-smoke >/dev/null 2>&1 || true
      [ "$ok" = "1" ] || { echo "SMOKE FAILED — the image does not start; refusing to push"; exit 1; }
      echo "=== smoke OK"
      # (2) :SHA only — promotion stays a reviewed digest pin
      echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      docker push "$IMAGE:$TAG"
      # (3) emit the digest the pin must use
      DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$TAG" | cut -d@ -f2)
      echo "pin=$IMAGE@$DIGEST"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# The shipped artefact itself: every jar the uber/fast-jar actually carries, plus
# the OS layer — what the offline fs scan cannot see. On main it follows
# build-image (same :SHA); on the weekly schedule it re-scans the current main
# :SHA so new CVEs are caught without a commit. HIGH/CRITICAL with a fix block
# (the register .trivyignore.yaml lists accepted ones); unfixed are reported.
cve-scan-artifact:
  stage: build
  image:
    name: aquasec/trivy:0.71.2
    entrypoint: [""]
  timeout: 60 minutes
  needs:
    - job: build-image
      optional: true
  variables:
    TRIVY_DB_REPOSITORY: "public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2"
    TRIVY_CACHE_DIR: $CI_PROJECT_DIR/.trivycache
    TRIVY_TIMEOUT: 40m
    TRIVY_SKIP_VERSION_CHECK: "true"
    IMAGE_REF: "$REGISTRY_NAMESPACE/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    # Read the pushed image back through the LAN pull-through cache rather than from Docker Hub over
    # the uplink (see cve-scan). The cache proxies any docker.io repository, ours included.
    MIRROR: "10.152.183.230:5000"
    TRIVY_VERSION: "0.71.2"
    HELLO_SRE_REF: "4933c7f46d04563d4521bb69725b53fb8ab49b20"
  cache:
    key: trivy-dbs
    paths: [.trivycache]
  script:
    - *trivy_dbs_from_mirror
    - set -a; . ./trivy-db.env; set +a
    - echo "=== artefact scan of $IMAGE_REF (via $MIRROR)"
    - trivy image --insecure --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --format json --output queryskiff-artifact-cve.json "$MIRROR/$IMAGE_REF"
    - trivy image --insecure --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed --ignorefile .trivyignore.yaml --format table "$MIRROR/$IMAGE_REF"
  artifacts:
    when: always
    paths: [queryskiff-artifact-cve.json]
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_SCAN == "1"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
